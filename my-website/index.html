<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Popcorn Party</title>
  <link rel="stylesheet" href="css/home.css">
  <link rel="preload" href="css/home.css" as="style">
  <link rel="preload" href="js/home.js" as="script">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script defer src="js/home.js"></script>
</head>

<body>
  <header class="navbar" id="navbar">
  <img src="logo.png" alt="Popcorn Party Logo" />
  <nav class="nav-links">
    <a href="index.html">Home</a>
    <a href="#">Movies</a>
    <a href="#">TV Shows</a>
    <a href="#">Anime</a>
    <input type="text" class="search-bar" placeholder="Search..." onfocus="openSearchModal()" />
  </nav>
</header>

  <div class="banner" id="banner">
  <div class="banner-content">
    <h1 id="banner-title"></h1>
    <p id="banner-description"></p>
    <div class="banner-buttons">
      <button class="btn btn-play" onclick="playBanner()">
        <i class="fas fa-play"></i> Play
      </button>
      <button class="btn btn-info" onclick="showBannerInfo()">
        <i class="fas fa-info-circle"></i> More Info
      </button>
    </div>
  </div>
</div>

  <!-- My List Section -->
<div class="row" id="mylist-row" style="display: none;">
  <h2>My List</h2>
  <div class="list" id="mylist-list"></div>
</div>
  <div class="row">
    <h2>Trending Movies</h2>
    <div class="list" id="movies-list"></div>
  </div>

  <div class="row">
    <h2>Trending TV Shows</h2>
    <div class="list" id="tvshows-list"></div>
  </div>

  <div class="row">
    <h2>Trending Anime</h2>
    <div class="list" id="anime-list"></div>
  </div>

  <div class="modal" id="modal" onclick="closeModalOnBackdrop(event)">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    
    <div class="modal-header" id="modal-backdrop">
      <div class="modal-header-content">
        <h2 id="modal-title"></h2>
        <div class="stars" id="modal-rating"></div>
      </div>
    </div>
    
    <div class="modal-body">
      <div class="modal-info">
        <div class="modal-description" id="modal-description"></div>
        <div class="modal-meta">
          <p><span>Release:</span> <span id="modal-date"></span></p>
          <p><span>Rating:</span> <span id="modal-vote"></span></p>
        </div>
      </div>
      
      <!-- Episode Selector (shown only for TV shows) -->
      <div class="episode-selector" id="episode-selector" style="display: none;">
        <div class="selector-group">
          <label for="season-select">Season:</label>
          <select id="season-select" onchange="onSeasonChange()">
            <option>Loading seasons...</option>
          </select>
        </div>
        
        <div class="selector-group">
          <label for="episode-select">Episode:</label>
          <select id="episode-select" onchange="onEpisodeChange()">
            <option>Loading episodes...</option>
          </select>
        </div>
      </div>
      
      <!-- Server Selector -->
      <div class="server-selector" id="server-selector">
        <label for="server">Server:</label>
        <select id="server" onchange="changeServer()">
          <option value="vidsrc.cc">Vidsrc.cc</option>
          <option value="vidsrc.me">Vidsrc.me</option>
          <option value="player.videasy.net">Player.Videasy.net</option>
        </select>
      </div>
      
      <iframe id="modal-video" allowfullscreen></iframe>
    </div>
  </div>
</div>

  <div class="search-modal" id="search-modal" onclick="closeSearchModalOnBackdrop(event)">
  <span class="close" onclick="closeSearchModal()">&times;</span>
  <input type="text" id="search-input" placeholder="Titles, people, genres..." oninput="searchTMDB()" />
  <div class="results" id="search-results"></div>
</div>

<footer class="footer">
  <div class="footer-content">
    <div class="footer-links">
      <a href="#">FAQ</a>
      <a href="#">Help Center</a>
      <a href="#">Terms of Use</a>
      <a href="#">Privacy</a>
      <a href="#">Cookie Preferences</a>
      <a href="#">Contact Us</a>
    </div>
    <p>&copy; 2025 Popcorn Party. All rights reserved.</p>
  </div>
</footer>

  
</body>
