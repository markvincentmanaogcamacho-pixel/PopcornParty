# Popcorn Party — auto-build APK
#
# Triggers:
#   - Every push to `main` (builds the APK, uploads as workflow artifact)
#   - Every tag matching v* (e.g. v1.0.0) also publishes a GitHub Release
#     containing the signed APK.
#
# Secrets required (set under Settings → Secrets → Actions):
#   KEYSTORE_BASE64  — base64 of popcornparty.keystore (see setup below)
#   KEYSTORE_PASSWORD — keystore password
#   KEY_ALIAS        — key alias (popcornparty)
#   KEY_PASSWORD     — key password
#
# Setup (one-time, from a machine with the keystore):
#   base64 -w0 popcornparty.keystore   → paste into KEYSTORE_BASE64

name: Build Popcorn Party APK

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/popcornparty.keystore
          echo "keystore ready ($(stat -c%s app/popcornparty.keystore) bytes)"

      - name: Grant wrapper execute permission
        run: chmod +x gradlew

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ../app/popcornparty.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popcorn-party-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: popcorn-party-apk

      - name: Rename APK with version tag
        run: mv app-release.apk PopcornParty-${{ github.ref_name }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: PopcornParty-${{ github.ref_name }}.apk
          generate_release_notes: true
